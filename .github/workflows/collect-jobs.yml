# Daily jobs collection into the Supabase jobs repository (see server/collectJobs.js).
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, APIFY_TOKEN,
# and optionally ADZUNA_APP_ID / ADZUNA_APP_KEY.
# GitHub only runs scheduled workflows from the default branch (main).
name: Collect jobs

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 06:00 IST, every day
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to run (comma-separated: linkedin, adzuna, discover, boards). Empty = all."
        required: false
        default: ""

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ -n "${{ inputs.sources }}" ]; then
            npm run collect -- --sources="${{ inputs.sources }}"
          else
            npm run collect
          fi

